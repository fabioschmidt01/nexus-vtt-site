<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Nexus VTT">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2232"/>
      <stop offset="1" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.45" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="thread" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- fundo -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="27.5" fill="none" stroke="#f59e0b" stroke-opacity=".35"/>
  <!-- fio de trás (passa atrás do dado) -->
  <path d="M14 82 C 40 56, 88 104, 114 70" fill="none" stroke="url(#thread)" stroke-width="5" stroke-linecap="round" opacity=".55"/>
  <!-- d20: contorno hexagonal + faces -->
  <g fill="none" stroke="url(#gold)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M64 18 L104 41 L104 87 L64 110 L24 87 L24 41 Z" fill="#0f141f"/>
    <path d="M64 40 L88 82 L40 82 Z"/>
    <path d="M64 18 L64 40 M104 41 L88 82 M104 87 L88 82 M64 110 L88 82 M64 110 L40 82 M24 87 L40 82 M24 41 L40 82 M24 41 L64 40 M104 41 L64 40" stroke-width="3" opacity=".85"/>
  </g>
  <!-- fio da frente (o nó) -->
  <path d="M14 46 C 42 74, 86 22, 114 58" fill="none" stroke="url(#thread)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="64" cy="62" r="5" fill="#fde68a"/>
</svg>
